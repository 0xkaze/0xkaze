name: profile card

on:
  schedule:
    - cron: "7 3 * * *"          # daily, ~00:07 in São Paulo/Curitiba
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["card.py", "ascii/**", ".github/workflows/card.yml"]

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render card
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}   # optional: adds private repos
          GITHUB_TOKEN: ${{ github.token }}
        run: python card.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          git diff --cached --quiet && exit 0
          git commit -m "chore(card): update profile stats"
          git push
